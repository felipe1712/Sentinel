name: urbanwatch

services:
  # 1. Frontend Vite + React 18 + TypeScript + Bootstrap 5 (Diseño Trezo CronosOne)
  frontend:
    build: ./frontend
    container_name: uwi_frontend
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - VITE_API_URL=http://localhost:8100
    depends_on:
      - api
    restart: unless-stopped

  # 2. API Principal en Rust (Axum 0.7 + SQLx + PostGIS)
  api:
    build: ./backend
    container_name: uwi_rust_api
    ports:
      - "127.0.0.1:8100:8100"
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8100
      - DATABASE_URL=postgresql://urbanwatch:${DB_PASSWORD:-urbanwatch_pass_2026}@postgres:5432/urbanwatch_db
      - WORKERS_URL=http://workers:8001
      - LIGHTPANDA_CDP_URL=ws://lightpanda:9222
      - HEADLESSX_URL=http://headlessx:38473
      - PIXELRAG_INDEX_DIR=/data/pixelrag_indexes
      - DOCUMENTS_PATH=/data/documents
      - CAPTURES_PATH=/data/captures
    depends_on:
      - postgres
      - redis
    volumes:
      - uwi_data:/data
      - ./scripts:/app/scripts
    restart: unless-stopped

  # 3. Workers Python (Surya OCR, Clasificador Claude, E-Medios Lightpanda, Vigía HeadlessX + PixelRAG, WorldMonitor MCP)
  workers:
    build: ./workers
    container_name: uwi_workers
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://urbanwatch:${DB_PASSWORD:-urbanwatch_pass_2026}@postgres:5432/urbanwatch_db
      - REDIS_URL=redis://redis:6379/1
      - LIGHTPANDA_CDP_URL=ws://lightpanda:9222
      - HEADLESSX_URL=http://headlessx:38473
      - PIXELRAG_INDEX_DIR=/data/pixelrag_indexes
      - DOCUMENTS_PATH=/data/documents
      - CAPTURES_PATH=/data/captures
    depends_on:
      - postgres
      - redis
      - lightpanda
    volumes:
      - uwi_data:/data
      - ./scripts:/app/scripts
    restart: unless-stopped

  # 4. Celery Worker (colas: default, emedios, vigia)
  celery:
    build: ./workers
    container_name: uwi_celery
    command: celery -A workers.celery_app worker -l info -c 4 -Q default,emedios,vigia
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://urbanwatch:${DB_PASSWORD:-urbanwatch_pass_2026}@postgres:5432/urbanwatch_db
      - REDIS_URL=redis://redis:6379/1
      - LIGHTPANDA_CDP_URL=ws://lightpanda:9222
      - HEADLESSX_URL=http://headlessx:38473
    depends_on:
      - redis
      - postgres
    volumes:
      - uwi_data:/data
      - ./scripts:/app/scripts
    restart: unless-stopped

  # 5. Celery Beat (Scheduler de jobs periódicos de Vigía y E-Medios)
  celery-beat:
    build: ./workers
    container_name: uwi_celery_beat
    command: celery -A workers.celery_app beat -l info
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    restart: unless-stopped

  # 6. PostgreSQL 15 + PostGIS 3.3
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: uwi_postgres
    environment:
      POSTGRES_DB: urbanwatch_db
      POSTGRES_USER: urbanwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urbanwatch_pass_2026}
    volumes:
      - uwi_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  # 7. Redis 7
  redis:
    image: redis:7-alpine
    container_name: uwi_redis
    volumes:
      - uwi_redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  # 8. Lightpanda (Binario oficial desde GitHub Releases — Skill 3)
  lightpanda:
    build:
      context: ./docker
      dockerfile: Dockerfile.lightpanda
    container_name: uwi_lightpanda
    ports:
      - "127.0.0.1:9222:9222"
    restart: unless-stopped

  # 9. HeadlessX (Servicio anti-detección en :38473 — Skill 1)
  headlessx:
    build:
      context: ./docker
      dockerfile: Dockerfile.headlessx
    container_name: uwi_headlessx
    ports:
      - "127.0.0.1:38473:38473"
    environment:
      - HEADLESSX_API_KEY=${HEADLESSX_API_KEY:-hx_urbanwatch_key_2026}
    volumes:
      - uwi_browser:/app/data
    restart: unless-stopped

volumes:
  uwi_pg:
  uwi_redis:
  uwi_browser:
  uwi_data:
